<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTO 翻前盲打训练舱 v2.4</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --table-felt: #1a4d2e;
            --table-border: #5d4037;
            --card-white: #ffffff;
            --pos-inactive: #334155;
            --pos-active: #f59e0b;
            --btn-fold: #374151;
            --btn-call: #059669;
            --btn-raise: #b91c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background-color: var(--bg-dark); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        /* 顶部标题栏 */
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { color: #f59e0b; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .version-tag { background: #334155; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; color: #94a3b8; }

        /* 扑克桌容器 */
        .table-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: var(--table-felt);
            border: 8px solid var(--table-border);
            border-radius: 200px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 位置标签系统 */
        .seat {
            position: absolute;
            background: var(--pos-inactive);
            color: white;
            padding: 6px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        .seat.active { background: var(--pos-active); box-shadow: 0 0 15px var(--pos-active); color: #000; transform: scale(1.1); }
        .seat.villain-raise { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

        /* 位置坐标定义 */
        .sb { top: 15%; left: 35%; }
        .bb { top: 15%; right: 35%; }
        .utg { top: 45%; right: 5%; }
        .hj { bottom: 15%; right: 35%; }
        .co { bottom: 15%; left: 35%; }
        .bu { top: 45%; left: 5%; }

        /* 场景提示文字 */
        .scenario-hint { position: absolute; top: 25%; text-align: center; width: 100%; }
        .hint-badge { background: rgba(0,0,0,0.6); color: #ef4444; border: 1px solid #ef4444; padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 5px; display: inline-block; }
        .pot-info { color: #f59e0b; font-weight: bold; font-size: 1rem; display: block; }

        /* 扑克牌样式 */
        .cards-area { display: flex; gap: 15px; perspective: 1000px; }
        .card {
            width: 90px;
            height: 130px;
            background: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .card.suit-red { color: #e11d48; }
        .card .suit-icon { font-size: 1.5rem; margin-top: -5px; }

        /* 公共牌占位符 */
        .board-placeholders { display: flex; gap: 8px; position: absolute; top: 35%; opacity: 0.3; pointer-events: none; }
        .placeholder { width: 45px; height: 65px; border: 2px dashed #94a3b8; border-radius: 4px; }

        /* 操作按钮 */
        .action-container { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .action-btn { 
            border: none; border-radius: 12px; padding: 25px; cursor: pointer; color: white; transition: transform 0.1s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-main-text { font-size: 1.5rem; font-weight: bold; }
        .btn-sub-text { font-size: 0.8rem; opacity: 0.8; }
        .fold { background: var(--btn-fold); }
        .call { background: var(--btn-call); }
        .raise { background: var(--btn-raise); }

        /* 底部统计栏 */
        .stats-bar {
            width: 100%; max-width: 900px; background: #1e293b; border-radius: 12px; padding: 15px;
            display: grid; grid-template-columns: repeat(3, 1fr); text-align: center;
        }
        .stat-item { display: flex; flex-direction: column; gap: 5px; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #f8fafc; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">♠️ GTO 翻前盲打训练舱</div>
        <div class="version-tag">v2.4 Auto-Summary</div>
    </div>

    <div class="table-container">
        <!-- 位置标签 -->
        <div id="seat-SB" class="seat sb">SB</div>
        <div id="seat-BB" class="seat bb">BB (HERO)</div>
        <div id="seat-UTG" class="seat utg">UTG</div>
        <div id="seat-HJ" class="seat hj">HJ</div>
        <div id="seat-CO" class="seat co">CO</div>
        <div id="seat-BU" class="seat bu">BU</div>

        <!-- 场景提示 -->
        <div class="scenario-hint">
            <div id="hint-text" class="hint-badge">正在等待决策...</div>
            <div id="pot-text" class="pot-info">POT: 1.5 BB</div>
        </div>

        <!-- 公共牌占位 -->
        <div class="board-placeholders">
            <div class="placeholder"></div><div class="placeholder"></div><div class="placeholder"></div><div class="placeholder"></div><div class="placeholder"></div>
        </div>

        <!-- Hero 手牌 -->
        <div class="cards-area">
            <div id="card1" class="card">J <span class="suit-icon">♠</span></div>
            <div id="card2" class="card suit-red">4 <span class="suit-icon">♥</span></div>
        </div>
    </div>

    <div class="action-container">
        <button class="action-btn fold" onclick="makeDecision('Fold')">
            <span class="btn-main-text">弃牌</span>
            <span class="btn-sub-text">Fold</span>
        </button>
        <button class="action-btn call" onclick="makeDecision('Call')">
            <span class="btn-main-text">跟注</span>
            <span class="btn-sub-text">Call</span>
        </button>
        <button class="action-btn raise" onclick="makeDecision('Raise')">
            <span class="btn-main-text">加注</span>
            <span class="btn-sub-text">Raise</span>
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">训练手数</span>
            <span id="stat-hands" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">肌肉准确率</span>
            <span id="stat-accuracy" class="stat-value">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">平均响应</span>
            <span id="stat-time" class="stat-value">-</span>
        </div>
    </div>

    <script>
        const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
        const SUITS = [
            { symbol: '♠', name: 's', isRed: false },
            { symbol: '♥', name: 'h', isRed: true },
            { symbol: '♣', name: 'c', isRed: false },
            { symbol: '♦', name: 'd', isRed: true }
        ];
        const POSITIONS = ['SB', 'BB', 'UTG', 'HJ', 'CO', 'BU'];

        let gameState = {
            heroHand: [],
            heroPos: 'BB',
            villainPos: null,
            correctAction: '',
            startTime: 0,
            stats: { hands: 0, correct: 0, totalTime: 0 }
        };

        // 陈强华公式计算
        function getChenScore(r1, r2, suited) {
            const valMap = { 'A':10, 'K':8, 'Q':7, 'J':6, 'T':5, '9':4.5, '8':4, '7':3.5, '6':3, '5':2.5, '4':2, '3':1.5, '2':1 };
            let s1 = valMap[r1], s2 = valMap[r2];
            if (s1 < s2) [s1, s2] = [s2, s1];
            
            let score = (r1 === r2) ? Math.max(5, s1 * 2) : s1;
            if (suited) score += 2;
            const gap = RANKS.indexOf(r1) - RANKS.indexOf(r2) - 1;
            if (gap === 0) score += 1;
            else if (gap === 1) score -= 1;
            else if (gap === 2) score -= 2;
            else if (gap === 3) score -= 4;
            else if (gap >= 4) score -= 5;
            return score;
        }

        function initNewHand() {
            // 随机生成 Hero 手牌
            const r1 = RANKS[Math.floor(Math.random()*13)];
            const r2 = RANKS[Math.floor(Math.random()*13)];
            const s1 = SUITS[Math.floor(Math.random()*4)];
            let s2 = SUITS[Math.floor(Math.random()*4)];
            if (r1 === r2 && s1.symbol === s2.symbol) s2 = SUITS[(SUITS.indexOf(s1)+1)%4];

            gameState.heroHand = [{r:r1, s:s1}, {r:r2, s:s2}];
            
            // 随机场景：RFI 或 面对 Raise
            const isFacingRaise = Math.random() > 0.4;
            gameState.heroPos = 'BB'; // 训练 BB 位防御是最核心的
            
            // 清理位置样式
            POSITIONS.forEach(p => document.getElementById(`seat-${p}`).className = 'seat ' + p.toLowerCase());
            document.getElementById('seat-BB').classList.add('active');

            if (isFacingRaise) {
                const villains = ['UTG', 'HJ', 'CO', 'BU', 'SB'];
                gameState.villainPos = villains[Math.floor(Math.random()*villains.length)];
                document.getElementById(`seat-${gameState.villainPos}`).classList.add('villain-raise');
                document.getElementById('hint-text').innerText = `面对 ${gameState.villainPos} 率先 Raise`;
                document.getElementById('pot-text').innerText = `POT: 2.5 BB`;
                
                // 简单判定逻辑：陈氏分高于对手门槛
                const score = getChenScore(r1, r2, s1.symbol === s2.symbol);
                gameState.correctAction = score >= 7.5 ? 'Raise' : (score >= 4.5 ? 'Call' : 'Fold');
            } else {
                gameState.villainPos = null;
                document.getElementById('hint-text').innerText = `等待所有人 Fold 到你`;
                document.getElementById('pot-text').innerText = `POT: 1.5 BB`;
                const score = getChenScore(r1, r2, s1.symbol === s2.symbol);
                gameState.correctAction = score >= 6.5 ? 'Raise' : 'Fold';
            }

            // 更新手牌 UI
            renderCard('card1', gameState.heroHand[0]);
            renderCard('card2', gameState.heroHand[1]);
            
            gameState.startTime = Date.now();
        }

        function renderCard(id, cardData) {
            const el = document.getElementById(id);
            el.innerHTML = `${cardData.r} <span class="suit-icon">${cardData.s.symbol}</span>`;
            el.className = `card ${cardData.s.isRed ? 'suit-red' : ''}`;
        }

        function makeDecision(action) {
            const duration = (Date.now() - gameState.startTime) / 1000;
            const isCorrect = action === gameState.correctAction;

            gameState.stats.hands++;
            if (isCorrect) gameState.stats.correct++;
            gameState.stats.totalTime += duration;

            // 更新统计 UI
            document.getElementById('stat-hands').innerText = gameState.stats.hands;
            document.getElementById('stat-accuracy').innerText = ((gameState.stats.correct / gameState.stats.hands)*100).toFixed(1) + '%';
            document.getElementById('stat-time').innerText = (gameState.stats.totalTime / gameState.stats.hands).toFixed(2) + 's';

            // 震动反馈 (iOS/Android)
            if (!isCorrect && navigator.vibrate) navigator.vibrate(200);

            // 自动进入下一手
            initNewHand();
        }

        window.onload = initNewHand;
    </script>
</body>
</html>
