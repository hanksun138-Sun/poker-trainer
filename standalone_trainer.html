<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTO 扑克AI核心训练系统 (iPad 优化版)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        h1 { font-size: 1.2rem; color: var(--accent-blue); }
        .stats { font-size: 0.9rem; color: var(--text-muted); }
        
        .table-felt {
            background: #064e3b;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            border: 4px solid #047857;
            position: relative;
        }
        .position-badge {
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .hand-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 10px 0;
            color: #fbbf24;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .prompt-text {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 16px 0;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); }
        .btn-fold { background-color: var(--accent-red); }
        .btn-call { background-color: var(--accent-blue); }
        .btn-raise { background-color: var(--accent-green); }

        .feedback-panel {
            background: #0f172a;
            border-radius: 10px;
            padding: 15px;
            min-height: 100px;
            border-left: 5px solid var(--text-muted);
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .feedback-panel.correct { border-left-color: var(--accent-green); }
        .feedback-panel.incorrect { border-left-color: var(--accent-red); }

        .footer-actions {
            display: flex;
            gap: 10px;
        }
        .btn-secondary {
            flex: 1;
            background: #475569;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-secondary:active { background: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ GTO 核心训练终端</h1>
            <div class="stats" id="stats-text">准确率: 0% (0/0)</div>
        </header>

        <div class="table-felt">
            <div class="position-badge" id="pos-display">加载中...</div>
            <div class="hand-display" id="hand-display">--</div>
            <div class="prompt-text" id="prompt-desc">请选择最优 GTO 策略动作</div>
        </div>

        <div class="action-grid">
            <button class="btn btn-fold" onclick="handleUserAction('Fold')">弃牌 (FOLD)</button>
            <button class="btn btn-call" onclick="handleUserAction('Call')">跟注 (CALL)</button>
            <button class="btn btn-raise" onclick="handleUserAction('Raise')">加注 (RAISE)</button>
        </div>

        <div class="feedback-panel" id="feedback-panel">
            准备就绪。点击下方按钮或直接做出决策，训练系统将实时比对 AI 均衡策略。
        </div>

        <div class="footer-actions">
            <button class="btn-secondary" onclick="nextHand()">下一手 (Next)</button>
            <button class="btn-secondary" onclick="exportLogs()">导出日志 (JSON)</button>
        </div>
    </div>

    <script>
        const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
        const POSITIONS = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
        
        const RFI_THRESHOLDS = {
            'UTG': 10.0,
            'HJ':  9.0,
            'CO':  7.5,
            'BTN': 5.5,
            'SB':  6.5,
            'BB':  5.0
        };

        let currentScenario = {};
        let sessionStats = { total: 0, correct: 0 };
        let sessionLogs = [];
        let startTime = 0;

        // 增强版 Chen Formula 核心计算引擎
        function calculateChenScoreEnhanced(handStr) {
            let r1 = handStr[0], r2 = handStr[1];
            const isSuited = handStr.includes('s');
            const isPair = (r1 === r2);
            
            if (RANKS.indexOf(r1) < RANKS.indexOf(r2)) [r1, r2] = [r2, r1];

            const valMap = {
                'A': 10, 'K': 8, 'Q': 7, 'J': 6, 'T': 5,
                '9': 4.5, '8': 4, '7': 3.5, '6': 3, '5': 2.5, '4': 2, '3': 1.5, '2': 1
            };

            let score = isPair ? Math.max(5, valMap[r1] * 2) : valMap[r1];

            if (!isPair) {
                if (isSuited) score += 2.5; 

                const gap = RANKS.indexOf(r1) - RANKS.indexOf(r2) - 1;
                if (gap === 0) score += 1; 
                else if (gap === 1) score -= 1;
                else if (gap === 2) score -= 2;
                else score -= 4;

                if (gap === 0 && RANKS.indexOf(r1) < 8) score += 1;
            }

            if (isSuited && r1 === 'A' && RANKS.indexOf(r2) < 4) score += 1.5;
            if (isSuited && r1 === 'K' && RANKS.indexOf(r2) < 5) score += 0.5;

            return score;
        }

        // 随机生成一手牌
        function generateRandomHand() {
            const r1 = RANKS[Math.floor(Math.random() * RANKS.length)];
            let r2 = RANKS[Math.floor(Math.random() * RANKS.length)];
            
            // 避免对子时花色冲突，简单用 s/o
            let isSuited = Math.random() > 0.65;
            if (r1 === r2) isSuited = false;

            let hand = (RANKS.indexOf(r1) >= RANKS.indexOf(r2)) ? (r1 + r2) : (r2 + r1);
            return hand + (isSuited ? 's' : (r1 === r2 ? '' : 'o'));
        }

        // 初始化新一手牌
        function nextHand() {
            const pos = POSITIONS[Math.floor(Math.random() * POSITIONS.length)];
            const hand = generateRandomHand();
            const score = calculateChenScoreEnhanced(hand);
            
            // 判定 GTO 理论动作
            const threshold = RFI_THRESHOLDS[pos];
            let gtoAction = 'Fold';
            let reasonBase = '';

            if (score >= threshold) {
                gtoAction = 'Raise';
                reasonBase = `Chen 得分 ${score.toFixed(1)} ≥ 门槛 ${threshold}`;
            } else if (pos === 'BB' && score >= 4.5) {
                gtoAction = 'Call'; // BB位防守补偿
                reasonBase = `BB位防守补偿 (得分 ${score.toFixed(1)})`;
            } else {
                gtoAction = 'Fold';
                reasonBase = `Chen 得分 ${score.toFixed(1)} < 门槛 ${threshold}`;
            }

            currentScenario = {
                pos: pos,
                hand: hand,
                score: score,
                correctAction: gtoAction,
                reason: reasonBase
            };

            // 渲染 UI
            document.getElementById('pos-display').innerText = `实战位置: ${pos}`;
            document.getElementById('hand-display').innerText = hand;
            document.getElementById('feedback-panel').innerHTML = "请做出你的决策...";
            document.getElementById('feedback-panel').className = "feedback-panel";
            
            startTime = Date.now();
        }

        // 用户做出动作
        function handleUserAction(action) {
            const decisionTime = (Date.now() - startTime) / 1000;
            const isCorrect = (action === currentScenario.correctAction);
            
            sessionStats.total++;
            if (isCorrect) sessionStats.correct++;

            // 更新统计显示
            const accuracy = ((sessionStats.correct / sessionStats.total) * 100).toFixed(1);
            document.getElementById('stats-text').innerText = `准确率: ${accuracy}% (${sessionStats.correct}/${sessionStats.total})`;

            // 反馈面板渲染
            const panel = document.getElementById('feedback-panel');
            panel.className = `feedback-panel ${isCorrect ? 'correct' : 'incorrect'}`;
            
            let html = `<strong>${isCorrect ? '✅ 决策正确 (GTO Match)' : '❌ 决策偏离 (EV Loss)'}</strong><br>`;
            html += `你的选择: <code>${action}</code> | AI 推荐: <code>${currentScenario.correctAction}</code><br>`;
            html += `解析: ${currentScenario.reason} (耗时: ${decisionTime.toFixed(1)}s)`;
            panel.innerHTML = html;

            // 记录结构化日志 (为后续对接 Gemini 准备)
            sessionLogs.push({
                timestamp: new Date().toISOString(),
                position: currentScenario.pos,
                hand: currentScenario.hand,
                chenScore: currentScenario.score,
                userAction: action,
                gtoAction: currentScenario.correctAction,
                isCorrect: isCorrect,
                decisionTimeSeconds: decisionTime
            });
        }

        // 导出结构化 JSON 日志
        function exportLogs() {
            if (sessionLogs.length === 0) {
                alert("当前没有可导出的日志，请先进行几轮训练！");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sessionLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `poker_training_log_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 页面加载后自动出第一手牌
        window.onload = function() {
            nextHand();
        };
    </script>
</body>
</html>
