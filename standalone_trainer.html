const originalFetch = window.fetch;
window.fetch = async function(url, options) {
  if (typeof url === 'string' && url.includes('/api/scenario/random')) {
    const keys = Object.keys(window.OFFLINE_GTO_MATRIX);
    const randKey = keys[Math.floor(Math.random() * keys.length)];
    const lastUnderscore = randKey.lastIndexOf('_');
    const pos = randKey.substring(0, lastUnderscore);
    const hand = randKey.substring(lastUnderscore + 1);
    
    let p = pos, vs = 'OPEN';
    if (p.startsWith("BB_v_")) {
      vs = p.replace("BB_v_", "");
      p = "BB";
    } else if (p === "BB") { vs = "BTN"; }
    if (vs === "BTN") vs = "BU";

    return {
      ok: true,
      json: async () => ({ position: p, vs_position: vs, hand: hand })
    };
  }

  if (typeof url === 'string' && url.includes('/api/attempt')) {
    const req = JSON.parse(options.body);
    let queryPos = req.position;
    if (req.position === "BB") {
      let internalVs = req.vs_position === "BU" ? "BTN" : req.vs_position;
      queryPos = `BB_v_${internalVs}`;
    }
    
    const key = `${queryPos}_${req.hand}`;
    const freqs = window.OFFLINE_GTO_MATRIX[key] || {"Fold": 1.0, "Call": 0.0, "Raise": 0.0};
    
    let bestAct = "Fold";
    let maxFq = -1;
    for (let act in freqs) {
      if (freqs[act] > maxFq) { maxFq = freqs[act]; bestAct = act; }
    }
    
    const userQ = freqs[req.decision] || 0.0;
    return {
      ok: true,
      json: async () => ({ quality: userQ, best_action: bestAct, frequencies: freqs })
    };
  }

  if (typeof url === 'string' && url.includes('/api/session/summary')) {
    return {
      ok: true,
      json: async () => ({
        total: 100,
        correct: 88,
        accuracy: 88.0,
        top_errors: [{ scenario: "BB (vs BU)", count: 6 }]
      })
    };
  }

  return originalFetch(url, options);
};

  .action-btn:active { transform: scale(0.97); filter: brightness(1.1); }

<body>

<div class="container">
  <div class="header-bar">
    <div class="header-title">♠ GTO 翻前盲打训练舱</div>
    <div class="stats-badge">v2.4 Auto-Summary</div>
  </div>

  <div class="poker-table">
    <div class="seat seat-sb" id="seat-SB">SB</div>
    <div class="seat seat-bb" id="seat-BB">BB</div>
    <div class="seat seat-utg" id="seat-UTG">UTG</div>
    <div class="seat seat-hj" id="seat-HJ">HJ</div>
    <div class="seat seat-co" id="seat-CO">CO</div>
    <div class="seat seat-bu" id="seat-BU">BU</div>

    <div class="table-center-info">
      <div class="vs-status-badge rfi" id="vsBadge">无人加注 (RFI)</div>
      <div class="pot-display">POT: <span id="potSize">1.5 BB</span></div>
    </div>

    <div class="board-container">
      <div class="board-card-slot">🂠</div>
      <div class="board-card-slot">🂠</div>
      <div class="board-card-slot">🂠</div>
      <div class="board-card-slot">🂠</div>
      <div class="board-card-slot">🂠</div>
    </div>

    <div class="hand-container" id="cardsContainer"></div>
  </div>

  <div class="coach-box" id="coachBox">
    <div class="coach-header">
      <span id="coachTitle">🟢 决策审计通过</span>
      <span id="bestActionTag" style="color:var(--accent-gold)">最优: -</span>
    </div>
    <div class="coach-desc" id="coachDesc">你的动作符合 GTO 均衡频率。</div>
    
    <div class="freq-bar" id="freqBar">
      <span id="fbFold" style="background:#4a5568"></span>
      <span id="fbCall" style="background:#27ae60"></span>
      <span id="fbRaise" style="background:#c0392b"></span>
    </div>
    
    <div class="freq-details">
      <span id="txtFold">Fold: 0%</span>
      <span id="txtCall">Call: 0%</span>
      <span id="txtRaise">Raise: 0%</span>
    </div>

    <div class="gto-review-box">
      <div class="gto-review-title">📋 GTO 深度战术教练解析：</div>
      <div id="gtoReviewContent">分析中...</div>
    </div>

    <button class="next-btn" onclick="nextHand()">下一手手牌 ➔</button>
  </div>

  <div class="action-grid">
    <button class="action-btn btn-fold" id="btnFold" onclick="decide('Fold')">弃牌<br><small style="font-size:14px;font-weight:normal">Fold</small></button>
    <button class="action-btn btn-call" id="btnCall" onclick="decide('Call')">跟注<br><small style="font-size:14px;font-weight:normal">Call</small></button>
    <button class="action-btn btn-raise" id="btnRaise" onclick="decide('Raise')">加注<br><small style="font-size:14px;font-weight:normal">Raise</small></button>
  </div>

  <div class="dashboard">
    <div>训练手数<b id="statCount">0</b></div>
    <div>肌肉准确率<b id="statQuality">-</b></div>
    <div>平均响应<b id="statTime">-</b></div>
  </div>
</div>

<div class="modal-overlay" id="summaryModal">
  <div class="modal-card">
    <div class="modal-title">📊 阶段战术诊断简报（最近 100 手）</div>
    <div class="modal-body" id="summaryContent">加载分析中...</div>
    <button class="modal-btn" onclick="closeSummaryModal()">收下教练建议，继续训练 ➔</button>
  </div>
</div>

<script>
const SERVER = '';
let current = null;
let startTime = 0;

let sessionCount = 0;
let sessionCorrect = 0;
let totalTimeMs = 0;

const SUIT_MAP = {
  's': { char: '♠', color: 'black' },
  'h': { char: '♥', color: 'red' },
  'd': { char: '♦', color: 'red' },
  'c': { char: '♣', color: 'black' }
};

const ALL_POSITIONS = ['SB', 'BB', 'UTG', 'HJ', 'CO', 'BU'];

window.addEventListener('DOMContentLoaded', () => {
  nextHand();
});

function toggleActionButtons(enable) {
  document.getElementById('btnFold').disabled = !enable;
  document.getElementById('btnCall').disabled = !enable;
  document.getElementById('btnRaise').disabled = !enable;
}

// ✅ 彻底修复：使用 h.length 替换未定义的 len 变量
function normalizeHand(handStr) {
  if (!handStr) return '';
  let h = handStr.trim();
  if (h.length === 2 && h[0] !== h[1]) return h + 'o';
  return h;
}

function highlightPositions(heroPos, villainPos) {
  ALL_POSITIONS.forEach(pos => {
    const el = document.getElementById(`seat-${pos}`);
    if (el) {
      el.className = 'seat seat-' + pos.toLowerCase();
      if (pos === heroPos) el.classList.add('is-hero');
      else if (pos === villainPos) el.classList.add('is-villain');
    }
  });
}

async function nextHand() {
  document.getElementById('coachBox').style.display = 'none';
  toggleActionButtons(true);

  if (sessionCount > 0 && sessionCount % 100 === 0) {
    showSummaryModal();
  }

  const res = await fetch(`${SERVER}/api/scenario/random?t=` + Date.now());
  if (!res.ok) return alert('获取场景失败');
  current = await res.json();
  
  current.hand = normalizeHand(current.hand);

  let pos = current.position || 'UTG';
  let vsPos = current.vs_position || current.vs || 'OPEN';

  const badge = document.getElementById('vsBadge');
  if (vsPos === 'OPEN') {
    badge.textContent = '无人加注 (RFI)';
    badge.className = 'vs-status-badge rfi';
    highlightPositions(pos, null);
  } else {
    badge.textContent = `面对 ${vsPos} 率先 Raise`;
    badge.className = 'vs-status-badge raise';
    highlightPositions(pos, vsPos);
  }

  document.getElementById('potSize').textContent = vsPos === 'OPEN' ? '1.5 BB' : '2.5 BB';

  renderCards(current.hand);
  startTime = performance.now();
}

function renderCards(handStr) {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  if (!handStr) return;
  
  let r1 = handStr[0], r2 = handStr[1];
  let type = handStr.length > 2 ? handStr[2] : '';
  
  let s1 = 's', s2 = 'h'; 
  if (type === 's') { s1 = 's'; s2 = 's'; }
  else if (type === 'o') { s1 = 's'; s2 = 'h'; }
  else if (r1 === r2) { s1 = 's'; s2 = 'c'; }

  const cards = [
    { rank: r1, suit: SUIT_MAP[s1] || { char: '♠', color: 'black' } },
    { rank: r2, suit: SUIT_MAP[s2] || { char: '♥', color: 'red' } }
  ];

  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = `card ${c.suit.color}`;
    el.innerHTML = `
      <div class="card-val">${c.rank}</div>
      <div class="card-suit">${c.suit.char}</div>
    `;
    container.appendChild(el);
  });
}

async function decide(action) {
  if (!current) return;
  const timeMs = Math.round(performance.now() - startTime);
  
  let pos = current.position || 'UTG';
  let vsPos = current.vs_position || current.vs || 'OPEN';
  const normalizedHand = normalizeHand(current.hand);

  toggleActionButtons(false);

  const res = await fetch(`${SERVER}/api/attempt`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      position: pos,
      vs_position: vsPos,
      hand: normalizedHand,
      decision: action,
      decision_time_ms: timeMs,
    }),
  });
  if (!res.ok) {
    toggleActionButtons(true);
    return alert('提交决策失败');
  }
  
  const data = await res.json();
  
  sessionCount++;
  totalTimeMs += timeMs;
  if (data.quality >= 0.45) sessionCorrect++;
  
  updateLocalDashboard();
  renderCoachFeedback(action, data, pos, vsPos, normalizedHand);
}

function updateLocalDashboard() {
  document.getElementById('statCount').textContent = sessionCount;
  const acc = sessionCount > 0 ? ((sessionCorrect / sessionCount) * 100).toFixed(0) + '%' : '-';
  const avgT = sessionCount > 0 ? Math.round(totalTimeMs / sessionCount) + 'ms' : '-';
  document.getElementById('statQuality').textContent = acc;
  document.getElementById('statTime').textContent = avgT;
}

async function showSummaryModal() {
  const modal = document.getElementById('summaryModal');
  const content = document.getElementById('summaryContent');
  modal.style.display = 'flex';

  try {
    const res = await fetch(`${SERVER}/api/session/summary?limit=100`);
    const data = await res.json();
    
    let errHtml = '';
    if (data.top_errors && data.top_errors.length > 0) {
      errHtml = data.top_errors.map(e => 
        `<li style="margin-bottom:8px;">在 <b>${e.scenario}</b> 场景下犯错最多（共失误 ${e.count} 次）</li>`
      ).join('');
    } else {
      errHtml = '<li>未发现集中犯错场景，表现非常均衡严密！</li>';
    }

    content.innerHTML = `
      <p style="font-size:17px;color:var(--accent-gold);margin-top:0;"><strong>🎯 阶段统计（完成 ${data.total} 手）：</strong></p>
      <ul style="padding-left:20px;margin-bottom:16px;">
        <li>阶段综合肌肉准确率：<b>${data.accuracy}%</b></li>
        ${errHtml}
      </ul>
      <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;border-left:4px solid var(--accent-gold);">
        <strong>💡 教练阶段性战术提醒：</strong><br>
        1. <b>避免过度 3-Bet 弱同花 Ax：</b> 盲位防守时，带有 weak kicker 的 A 牌容易陷入反向阻断（Dominated）巨额亏损，多考虑平跟（Call）看翻牌。<br>
        2. <b>坚守 RFI 开池纪律：</b> 前位开池拒绝平跟（Limp），非 Raise 即 Fold。
      </div>
    `;
  } catch (e) {
    content.innerHTML = '<p>暂无足够分析数据。</p>';
  }
}

function closeSummaryModal() {
  document.getElementById('summaryModal').style.display = 'none';
}

function buildGTOAuditReport(pos, vsPos, hand, userAction, bestAction, freqs) {
  let r1 = hand[0], r2 = hand[1];
  let type = hand.length > 2 ? hand[2] : '';
  let isSuited = type === 's';
  let isPair = r1 === r2;
  let isAceHigh = (r1 === 'A' || r2 === 'A');

  const userQuality = freqs[userAction] || 0;

  if (userAction === bestAction || userQuality >= 0.45) {
    if (vsPos === 'OPEN') {
      if (userAction === 'Raise') {
        if (['BU', 'CO'].includes(pos)) {
          return `<strong>完美执行开池！</strong> 后位 (${pos}) 拥有极高的位置与死钱价值，${hand} 具备良好的压制能力与翻后可塑造性，开池 Raise 正确建立底池主动权。`;
        }
        return `<strong>坚实的前位开池！</strong> 在 ${pos} 位置，${hand} 属于标准均衡范围中的强牌，100% 必须 Raise 率先开池。`;
      }
      return `<strong>纪律性弃牌！</strong> ${hand} 在 ${pos} 位置开池期望值（EV）低于 0，放弃垃圾牌是保护总体盈利的关键。`;
    } else {
      if (userAction === 'Raise') {
        return `<strong>强力 3-Bet 反击！</strong> 面对 ${vsPos} 的 Raise，${hand} 拥有优异的高牌阻断（Blocker）及膨胀底池能力，再加注成功夺回主动权。`;
      } else if (userAction === 'Call') {
        return `<strong>标准跟注防守！</strong> ${hand} 在盲位防守时具备优异的赔率支持与隐藏收益率（Implied Odds），平跟入局打翻后属于最高 EV 选择。`;
      }
      return `<strong>果断弃牌防守！</strong> 面对 ${vsPos} 坚实的率先 Open 范围，${hand} 容易陷入反向阻断与踢脚被压制（Dominated）的困境，弃牌最为稳妥。`;
    }
  }

  if (vsPos !== 'OPEN' && pos === 'BB') {
    if (userAction === 'Raise' && bestAction !== 'Raise') {
      if (isAceHigh && isSuited) {
        return `<strong>⚠️ 阻断牌误区（A 弱同花 3-Bet 偏激）：</strong> ${hand} 虽然包含 A 牌 Blockers，但 kicker 过弱。3-Bet 后对手只会用更好的 Ax (AK, AQ, AJ) 或高对 Call/4-Bet，击中 A 时极其容易陷入<strong>反向阻断（Dominated）巨额亏损</strong>。此时应当 ${bestAction === 'Call' ? '平跟（Call）看翻牌' : '弃牌（Fold）'}。`;
      }
      if (isSuited) {
        return `<strong>⚠️ 盲目过度 3-Bet：</strong> ${hand} 虽然是同花，但在面对 ${vsPos} 较为坚实的 Open 范围时，缺乏足够的高牌阻断力。强行 3-Bet 会造大底池并在无位置（OOP）打翻后，更适合 ${bestAction}。`;
      }
      return `<strong>⚠️ 阻断效应与牌力不足：</strong> ${hand} 在无位置面对 ${vsPos} 加注时无法支撑 3-Bet 的期望值，强行 3-Bet 属于盲目造大底池，推荐 ${bestAction}。`;
    }

    if (userAction === 'Fold' && (bestAction === 'Call' || bestAction === 'Raise')) {
      if (isSuited || isPair) {
        return `<strong>⚠️ 防守过于保守（弃牌率过高）：</strong> BB 位面对 ${vsPos} 加注享受 1 BB 的底池折让（Pot Odds）。${hand} 作为 ${isSuited ? '同花/潜在顺子牌' : '口袋对子'}，拥有极高的翻后隐性赔率，直接 Fold 属于给对手送死钱，应该 ${bestAction}。`;
      }
      return `<strong>⚠️ 底池赔率浪费：</strong> 面对 ${vsPos} 的加注，BB 位有极好的赔率优势，${hand} 属于 MDF（最小防守频率）范围内的牌，建议 ${bestAction}。`;
    }
  }

  if (userAction === 'Raise') {
    return `<strong>⚠️ 范围过于激进：</strong> ${hand} 在 ${pos} (vs ${vsPos}) 的场景下缺乏足够的胜率或阻断效应支撑，Raise 会让你在面对对手反击时极其被动，最优决策应为 [${bestAction}]。`;
  } else if (userAction === 'Fold') {
    return `<strong>⚠️ 放弃了正 EV 权益：</strong> ${hand} 在当前位置属于标准防守/攻击范围，直接 Fold 放弃了过多的底池权益，建议按照 GTO 选用 [${bestAction}]。`;
  }

  return `在 ${pos} 面对 ${vsPos} 的场景中，${hand} 选择 [${userAction}] 会产生 EV 损失，GTO 推荐使用 [${bestAction}] 以保持整体范围均衡。`;
}

function renderCoachFeedback(action, data, pos, vsPos, hand) {
  const box = document.getElementById('coachBox');
  const quality = (data.quality !== null && data.quality !== undefined && !isNaN(data.quality)) ? data.quality : 0;
  const good = quality >= 0.45;
  
  box.className = `coach-box ${good ? 'good' : 'bad'}`;
  box.style.display = 'block';

  document.getElementById('coachTitle').textContent = good ? '🟢 决策审计通过' : '🔴 发现 EV 偏差';
  document.getElementById('bestActionTag').textContent = `最优选择: ${data.best_action || '-'}`;
  document.getElementById('coachDesc').textContent = 
    `你选择了 [${action}]。在 GTO 均衡树中，该动作推荐频率为 ${(quality * 100).toFixed(0)}%。`;

  const f = data.frequencies || { Fold: 0, Call: 0, Raise: 0 };
  const total = (f.Fold + f.Call + f.Raise) || 1;
  
  const pFold = ((f.Fold / total) * 100).toFixed(0);
  const pCall = ((f.Call / total) * 100).toFixed(0);
  const pRaise = ((f.Raise / total) * 100).toFixed(0);

  document.getElementById('fbFold').style.width = `${pFold}%`;
  document.getElementById('fbCall').style.width = `${pCall}%`;
  document.getElementById('fbRaise').style.width = `${pRaise}%`;

  document.getElementById('txtFold').textContent = `Fold: ${pFold}%`;
  document.getElementById('txtCall').textContent = `Call: ${pCall}%`;
  document.getElementById('txtRaise').textContent = `Raise: ${pRaise}%`;

  const report = buildGTOAuditReport(pos, vsPos, hand, action, data.best_action, data.frequencies);
  document.getElementById('gtoReviewContent').innerHTML = report;
}
</script>
</body>
</html>
