<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GTO 训练舱 v5.2 - Pro Analyst Edition</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --felt: #1a4d2e;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: "PingFang SC", system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px 10px; overflow-x: hidden;
        }

        /* 顶部看板 */
        .stats-header {
            width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(3, 1fr);
            background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-size: 1.1rem; font-weight: bold; font-family: monospace; display: block; }

        /* 扑克桌视图 */
        .table-view {
            position: relative; width: 100%; max-width: 800px; height: 380px;
            background: radial-gradient(circle, #2d6a4f 0%, #1a4d2e 100%);
            border: 10px solid #3d2b1f; border-radius: 190px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.6), 0 20px 40px rgba(0,0,0,0.4);
            margin: 10px 0; display: flex; justify-content: center; align-items: center;
        }

        /* 位置座位 - 严格按照 6人桌分布 */
        .seat {
            position: absolute; width: 65px; height: 65px;
            background: #1e293b; border: 2px solid #475569; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 0.8rem; font-weight: bold; transition: 0.3s;
        }
        .seat.hero { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); color: var(--accent); }
        .seat.villain { border-color: var(--danger); background: #450a0a; color: white; }
        .seat .dealer-chip { 
            position: absolute; right: -10px; bottom: -5px; background: white; color: black;
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.6rem; font-weight: 900; border: 1px solid #000;
        }

        /* 位置坐标 */
        .pos-SB { top: 10%; left: 30%; }
        .pos-BB { top: 10%; right: 30%; }
        .pos-UTG { top: 45%; right: 5%; }
        .pos-HJ { bottom: 10%; right: 30%; }
        .pos-CO { bottom: 10%; left: 30%; }
        .pos-BU { top: 45%; left: 5%; }

        /* 场景与决策提示 */
        .scenario-layer { position: absolute; top: 22%; text-align: center; width: 100%; z-index: 5; }
        .facing-bubble { 
            background: rgba(185, 28, 28, 0.9); color: white; padding: 4px 12px;
            border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: inline-block;
            margin-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .pot-display { color: #fbbf24; font-family: monospace; font-weight: bold; font-size: 1.1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* 手牌渲染 */
        .hand-layer { display: flex; gap: 15px; z-index: 10; }
        .card {
            width: 85px; height: 120px; background: white; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
            color: black; font-size: 1.8rem; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .card.suit-red { color: #e11d48; }
        .card-rank { line-height: 1; }
        .card-suit { align-self: flex-end; font-size: 2.2rem; line-height: 0.8; }

        /* 结果遮罩层 - 改良版 */
        #result-overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92);
            border-radius: 180px; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; padding: 40px; text-align: center;
        }
        .res-status { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }
        .res-gto { color: var(--accent); font-size: 1.1rem; margin-bottom: 15px; }
        .res-coach { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; max-width: 400px; }

        /* 操作控制 */
        .controls { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .ctrl-btn {
            border: none; border-radius: 14px; padding: 25px 10px; font-size: 1.3rem; font-weight: bold;
            color: white; cursor: pointer; transition: 0.1s; display: flex; flex-direction: column; align-items: center;
        }
        .ctrl-btn:active { transform: translateY(3px); filter: brightness(1.2); }
        .fold { background: #334155; } .call { background: #059669; } .raise { background: #b91c1c; }
        .btn-sub { font-size: 0.75rem; opacity: 0.7; font-weight: normal; margin-top: 4px; }

        /* 下一手按钮 */
        #next-btn {
            width: 100%; max-width: 900px; margin-top: 15px; background: #6366f1;
            padding: 18px; border: none; border-radius: 14px; color: white;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; display: none;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .table-view { height: 320px; border-radius: 100px; border-width: 5px; }
            .card { width: 65px; height: 95px; font-size: 1.4rem; }
            .pos-SB, .pos-BB { top: 5%; }
            .pos-HJ, .pos-CO { bottom: 5%; }
        }
    </style>
</head>
<body>

    <div class="stats-header">
        <div class="stat-box"><span class="stat-label">准确率</span><span id="st-acc" class="stat-val">0.0%</span></div>
        <div class="stat-box"><span class="stat-label">训练手数</span><span id="st-hands" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Avg 响应</span><span id="st-time" class="stat-val">0.0s</span></div>
    </div>

    <div class="table-view">
        <div id="result-overlay">
            <div id="res-status" class="res-status">WRONG</div>
            <div id="res-gto" class="res-gto">Optimal Action: Raise</div>
            <div id="res-coach" class="res-coach"></div>
        </div>

        <!-- Seats -->
        <div id="seat-SB" class="seat pos-SB">SB</div>
        <div id="seat-BB" class="seat pos-BB">BB</div>
        <div id="seat-UTG" class="seat pos-UTG">UTG</div>
        <div id="seat-HJ" class="seat pos-HJ">HJ</div>
        <div id="seat-CO" class="seat pos-CO">CO</div>
        <div id="seat-BU" class="seat pos-BU">BU</div>

        <div class="scenario-layer">
            <div id="fac-bubble" class="facing-bubble" style="display:none">面对 BU Raise 2.5BB</div>
            <div id="pot-txt" class="pot-display">POT: 1.5 BB</div>
        </div>

        <div class="hand-layer" id="hero-hand"></div>
    </div>

    <div class="controls" id="btn-group">
        <button class="ctrl-btn fold" onclick="submitDecision('Fold')">
            <span>弃牌</span><span class="btn-sub">Fold</span>
        </button>
        <button class="ctrl-btn call" onclick="submitDecision('Call')">
            <span>跟注</span><span class="btn-sub">Call</span>
        </button>
        <button class="ctrl-btn raise" onclick="submitDecision('Raise')">
            <span>加注</span><span class="btn-sub">Raise</span>
        </button>
    </div>

    <button id="next-btn" onclick="nextHand()">下一手 (NEXT HAND)</button>

    <script>
        /**
         * 1. 精确概率发牌引擎 (Strict 1326 Combination)
         */
        const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
        const SUITS = [{s:'♠',id:'s',r:false}, {s:'♥',id:'h',r:true}, {s:'♣',id:'c',r:false}, {s:'♦',id:'d',r:true}];
        const POSITIONS = ['SB', 'BB', 'UTG', 'HJ', 'CO', 'BU'];

        function drawHand() {
            const rand = Math.floor(Math.random() * 1326);
            if (rand < 78) { // Pairs (13*6=78)
                const r = RANKS[Math.floor(rand/6)];
                return { h:[{r,s:SUITS[0]},{r,s:SUITS[1]}], type:'pair' };
            } else if (rand < 390) { // Suited (78*4=312)
                const pairIdx = Math.floor((rand-78)/4);
                const {r1,r2} = getRankPair(pairIdx);
                const s = SUITS[rand % 4];
                return { h:[{r:r1,s},{r:r2,s}], type:'suited' };
            } else { // Offsuit (78*12=936)
                const pairIdx = Math.floor((rand-390)/12);
                const {r1,r2} = getRankPair(pairIdx);
                return { h:[{r:r1,s:SUITS[0]},{r:r2,s:SUITS[1]}], type:'offsuit' };
            }
        }

        function getRankPair(idx) {
            let k = 0;
            for(let i=12; i>=0; i--) {
                for(let j=i-1; j>=0; j--) {
                    if(k === idx) return { r1:RANKS[i], r2:RANKS[j] };
                    k++;
                }
            }
        }

        /**
         * 2. GTO 策略计算引擎 (Continuous Chen Engine)
         */
        function getChenScore(hand) {
            const val = {'A':10,'K':8,'Q':7,'J':6,'T':5,'9':4.5,'8':4,'7':3.5,'6':3,'5':2.5,'4':2,'3':1.5,'2':1};
            let r1 = hand.h[0].r, r2 = hand.h[1].r;
            let s1 = val[r1], s2 = val[r2];
            if(s1 < s2) [s1, s2] = [s2, s1];

            let score = (r1 === r2) ? Math.max(5, s1 * 2) : s1;
            if(hand.type === 'suited') score += 2;
            const gap = RANKS.indexOf(r1) - RANKS.indexOf(r2) - 1;
            if(gap === 0) score += 1;
            else if(gap === 1) score -= 1;
            else if(gap === 2) score -= 2;
            else if(gap >= 3) score -= 4;

            // GTO 修正：低位同花 Ace 阻断效应与直顺潜力
            if(hand.type === 'suited' && r1 === 'A' && RANKS.indexOf(r2) < 4) score += 1.5;
            return score;
        }

        /**
         * 3. 核心训练逻辑
         */
        let session = {
            heroPos: '', villainPos: '', 
            currentHand: null, correctAction: '',
            startTime: 0, stats: { total: 0, right: 0, time: 0 }
        };

        function nextHand() {
            document.getElementById('result-overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('btn-group').style.opacity = '1';
            
            session.currentHand = drawHand();
            session.heroPos = POSITIONS[Math.floor(Math.random() * 6)];
            
            // 场景模拟：50% 面对 Raise，50% 率先加注
            const isFacingOpen = Math.random() > 0.5 && session.heroPos !== 'UTG';
            if (isFacingOpen) {
                const possibleVillains = POSITIONS.slice(0, POSITIONS.indexOf(session.heroPos)); // 简化处理，只取前位
                session.villainPos = possibleVillains.length > 0 ? possibleVillains[Math.floor(Math.random()*possibleVillains.length)] : null;
            } else {
                session.villainPos = null;
            }

            // 计算 GTO 动作
            const score = getChenScore(session.currentHand);
            const rfiThresh = { 'UTG':10, 'HJ':9.5, 'CO':8.5, 'BU':7.5, 'SB':7.5, 'BB':0 };
            
            if (!session.villainPos) {
                session.correctAction = score >= rfiThresh[session.heroPos] ? 'Raise' : 'Fold';
            } else {
                const vT = rfiThresh[session.villainPos];
                // SB 面对 Raise 倾向于 3Bet-or-Fold, BB 倾向于 Call 防御
                if (session.heroPos === 'BB') {
                    if (score >= vT + 2.5) session.correctAction = 'Raise';
                    else if (score >= vT - 2) session.correctAction = 'Call';
                    else session.correctAction = 'Fold';
                } else {
                    if (score >= vT + 1) session.correctAction = 'Raise';
                    else session.correctAction = 'Fold';
                }
            }

            updateUI();
            session.startTime = Date.now();
        }

        function updateUI() {
            // 清理位置
            POSITIONS.forEach(p => {
                const el = document.getElementById(`seat-${p}`);
                el.className = `seat pos-${p}`;
                el.innerHTML = p + (p === 'BU' ? '<div class="dealer-chip">D</div>' : '');
            });

            // 高亮位置
            document.getElementById(`seat-${session.heroPos}`).classList.add('hero');
            if (session.villainPos) {
                document.getElementById(`seat-${session.villainPos}`).classList.add('villain');
                document.getElementById('fac-bubble').style.display = 'inline-block';
                document.getElementById('fac-bubble').innerText = `面对 ${session.villainPos} Raise 2.5BB`;
                document.getElementById('pot-txt').innerText = `POT: 4.0 BB`;
            } else {
                document.getElementById('fac-bubble').style.display = 'none';
                document.getElementById('pot-txt').innerText = `POT: 1.5 BB`;
            }

            // 渲染手牌
            const handHtml = session.currentHand.h.map(c => `
                <div class="card ${c.s.r ? 'suit-red' : ''}">
                    <span class="card-rank">${c.r}</span>
                    <span class="card-suit">${c.s.s}</span>
                </div>
            `).join('');
            document.getElementById('hero-hand').innerHTML = handHtml;
        }

        function submitDecision(action) {
            const dur = (Date.now() - session.startTime) / 1000;
            const isRight = (action === session.correctAction);
            
            session.stats.total++;
            if (isRight) session.stats.right++;
            session.stats.time += dur;

            // 显示结算
            const score = getChenScore(session.currentHand);
            document.getElementById('result-overlay').style.display = 'flex';
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('btn-group').style.opacity = '0.3';

            const resTitle = document.getElementById('res-status');
            resTitle.innerText = isRight ? "决策正确 ✅" : "决策偏离 ❌";
            resTitle.style.color = isRight ? "var(--success)" : "var(--danger)";
            
            document.getElementById('res-gto').innerText = `Optimal Action: ${session.correctAction}`;
            
            let tip = `这手牌 Chen 分数为 ${score.toFixed(1)}。`;
            if (session.heroPos === 'BB' && session.villainPos) {
                tip += `大盲位面对 ${session.villainPos} 有宽广的防御权，适合${session.correctAction === 'Call' ? '平跟实现权益' : '挤压反击'}。`;
            } else if (session.correctAction === 'Fold') {
                tip += `该组合在 ${session.heroPos} 位置的 Equity 较低，长期属于负 EV 动作。`;
            } else {
                tip += `符合 ${session.heroPos} 的范围优势。`;
            }
            document.getElementById('res-coach').innerText = tip;

            // 更新数据看板
            document.getElementById('st-hands').innerText = session.stats.total;
            document.getElementById('st-acc').innerText = (session.stats.right / session.stats.total * 100).toFixed(1) + '%';
            document.getElementById('st-time').innerText = (session.stats.time / session.stats.total).toFixed(2) + 's';
        }

        window.onload = nextHand;
    </script>
</body>
</html>
