<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GTO 大师训练舱 v7.5 - 安全专业版</title>
    <style>
        :root {
            --bg-dark: #020617; --card-bg: #1e293b; --accent: #f59e0b;
            --success: #10b981; --danger: #ef4444; --felt: #115e59;
            --unseen: #334155; --low-acc: #991b1b; --mid-acc: #854d0e; --high-acc: #166534;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", sans-serif; }
        body { background-color: var(--bg-dark); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; overflow-x: hidden; }

        /* 顶部统计 */
        .top-nav { width: 100%; max-width: 850px; display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--card-bg); border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .stat-group { display: flex; gap: 15px; font-family: monospace; font-size: 0.85rem; }

        /* 扑克桌 */
        .table-view {
            position: relative; width: 100%; max-width: 800px; height: 380px;
            background: radial-gradient(circle, #134e4a 0%, #064e3b 100%);
            border: 10px solid #3d2b1f; border-radius: 190px; margin: 10px 0;
            display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
        }

        /* 座位 */
        .seat { position: absolute; width: 62px; height: 62px; background: #1e293b; border: 2px solid #475569; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; transition: 0.3s; z-index: 5; }
        .seat.hero { border-color: var(--accent); box-shadow: 0 0 20px var(--accent); color: var(--accent); transform: scale(1.1); }
        .seat.villain { border-color: var(--danger); background: #450a0a; animation: pulse 1.5s infinite; }
        .dealer-chip { position: absolute; bottom: -5px; right: -5px; background: white; color: black; width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 1.5px solid #000; }
        
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);} 70% {box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);} 100% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);} }

        /* 位置分布 */
        .pos-SB { top: 8%; left: 30%; } .pos-BB { top: 8%; right: 30%; } .pos-UTG { top: 45%; right: 5%; }
        .pos-HJ { bottom: 8%; right: 30%; } .pos-CO { bottom: 8%; left: 30%; } .pos-BU { top: 45%; left: 5%; }

        .scene-layer { position: absolute; top: 22%; text-align: center; width: 100%; z-index: 2; pointer-events: none; }
        .hint-bubble { background: var(--danger); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .hand-layer { display: flex; gap: 15px; z-index: 10; }
        .card { width: 85px; height: 120px; background: white; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; color: black; font-weight: 900; font-size: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .suit-red { color: #dc2626; }

        #feedback-overlay { position: absolute; inset: 0; background: rgba(2,6,23,0.92); border-radius: 180px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 30px; }
        
        #modal-matrix { position: fixed; inset: 0; background: rgba(2,6,23,0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .matrix-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 100%; max-width: 650px; margin-top: 20px; }
        .m-cell { aspect-ratio: 1; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 2px; }

        #modal-ai { position: fixed; inset: 0; background: #020617; z-index: 1100; display: none; flex-direction: column; padding: 30px; overflow-y: auto; align-items: center; }
        .ai-card { background: #1e293b; border: 1.5px solid #6366f1; padding: 25px; border-radius: 16px; color: #e2e8f0; line-height: 1.8; text-align: left; max-width: 800px; width: 100%; white-space: pre-wrap; margin-top: 20px; }

        .controls { width: 100%; max-width: 850px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        .ctrl-btn { border: none; border-radius: 14px; padding: 22px; font-size: 1.3rem; font-weight: 800; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .fold { background: #334155; } .call { background: #065f46; } .raise { background: #991b1b; }
        .next-trigger { width: 100%; max-width: 850px; background: #6366f1; color: white; padding: 20px; border-radius: 14px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <script>
        /**
         * 安全逻辑：从本地存储读取密钥，避免 GitHub 报错
         */
        let MY_GEMINI_KEY = localStorage.getItem('gemini_api_key') || "";

        // 首次运行或密钥失效时的引导
        function checkApiKey() {
            if (!MY_GEMINI_KEY || MY_GEMINI_KEY.length < 15) {
                let input = prompt("【安全初始化】为了绕过 GitHub 密钥审查，请在此输入您的 Gemini API 密钥：\n(该密钥将仅存在于您的 iPad 浏览器中)");
                if (input) {
                    localStorage.setItem('gemini_api_key', input.trim());
                    MY_GEMINI_KEY = input.trim();
                    location.reload();
                }
            }
        }
        
        // 点击标题可重置密钥
        function resetApiKey() {
            if(confirm("确定要重置 API 密钥吗？")) {
                localStorage.removeItem('gemini_api_key');
                location.reload();
            }
        }
    </script>

    <div class="top-nav">
        <div class="stat-group">
            <span id="st-hands">总计: 0</span>
            <span id="st-acc">准度: 0%</span>
            <span id="st-mastery">169覆盖: 0%</span>
        </div>
        <div onclick="resetApiKey()" style="font-weight:bold; color:var(--accent); cursor:pointer;">GTO 训练舱 v7.5 ⚡</div>
        <button onclick="toggleMatrix()" style="background:none; border:1px solid #475569; color:white; padding:4px 10px; border-radius:6px; font-size:0.8rem;">大师矩阵</button>
    </div>

    <div class="table-view">
        <div id="feedback-overlay">
            <div id="fb-res" style="font-size: 2.2rem; font-weight: 900; margin-bottom: 10px;">CORRECT</div>
            <div id="fb-gto" style="color:var(--accent); font-size:1.2rem; margin-bottom:10px;"></div>
            <div id="fb-coach" style="font-size:0.95rem; color:#cbd5e1; max-width:450px; line-height:1.6;"></div>
        </div>

        <div id="seat-SB" class="seat pos-SB">SB</div>
        <div id="seat-BB" class="seat pos-BB">BB</div>
        <div id="seat-UTG" class="seat pos-UTG">UTG</div>
        <div id="seat-HJ" class="seat pos-HJ">HJ</div>
        <div id="seat-CO" class="seat pos-CO">CO</div>
        <div id="seat-BU" class="seat pos-BU">BU</div>

        <div class="scene-layer">
            <div id="fac-hint" class="hint-bubble" style="display:none;"></div>
            <div id="pot-txt" style="color:#fbbf24; font-family:monospace; font-weight:bold; margin-top:5px;">POT: 1.5 BB</div>
        </div>

        <div class="hand-layer" id="hero-hand"></div>
    </div>

    <div class="controls" id="btn-group">
        <button class="ctrl-btn fold" onclick="makeDecision('Fold')">弃牌<span>Fold</span></button>
        <button class="ctrl-btn call" onclick="makeDecision('Call')">跟注<span>Call</span></button>
        <button class="ctrl-btn raise" onclick="makeDecision('Raise')">加注<span>Raise</span></button>
    </div>

    <button id="next-btn" class="next-trigger" onclick="initNewHand()">下一手 (NEXT HAND)</button>

    <div id="modal-ai">
        <h1 style="color:var(--accent); font-size:2rem;">⚡ AI 大师审计报告</h1>
        <p id="ai-milestone" style="color:#6366f1; margin:10px 0; font-weight:bold;"></p>
        <div id="ai-content" class="ai-card">分析中... 请稍候...</div>
        <button onclick="closeAiModal()" style="background:#6366f1; color:white; border:none; padding:15px 40px; border-radius:12px; margin-top:20px; font-weight:bold; cursor:pointer;">已接受指导，继续训练</button>
    </div>

    <div id="modal-matrix">
        <h2 style="margin-top:20px;">169 手牌大师热力图</h2>
        <div id="matrix-container" class="matrix-grid"></div>
        <button onclick="toggleMatrix()" style="background:#475569; color:white; border:none; padding:12px 30px; border-radius:8px; margin-top:20px; font-weight:bold; cursor:pointer;">返回训练</button>
    </div>

    <script>
        const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const SUITS = [{s:'♠',r:false}, {s:'♥',r:true}, {s:'♣',r:false}, {s:'♦',r:true}];
        const POSITIONS = ['SB', 'BB', 'UTG', 'HJ', 'CO', 'BU'];
        
        let stats = JSON.parse(localStorage.getItem('poker_v75_stats') || '{"total":0, "right":0, "logs":[]}');
        let heatmap = JSON.parse(localStorage.getItem('poker_v75_heatmap') || '{}');
        let state = { hand: null, heroPos: '', villainPos: null, correctAction: '', startTime: 0, lock: false };

        function drawHand() {
            const rand = Math.floor(Math.random() * 1326);
            if (rand < 78) {
                const r = RANKS[Math.floor(rand/6)];
                return { h:[{r,s:SUITS[0]},{r,s:SUITS[1]}], t:'p', key:r+r };
            } else if (rand < 390) {
                const pIdx = Math.floor((rand-78)/4);
                const {r1,r2} = getRankPair(pIdx);
                return { h:[{r:r1,s:SUITS[0]},{r:r2,s:SUITS[0]}], t:'s', key:r1+r2+'s' };
            } else {
                const pIdx = Math.floor((rand-390)/12);
                const {r1,r2} = getRankPair(pIdx);
                return { h:[{r:r1,s:SUITS[0]},{r:r2,s:SUITS[1]}], t:'o', key:r1+r2+'o' };
            }
        }

        function getRankPair(idx) {
            let k = 0;
            for(let i=0; i<13; i++) {
                for(let j=i+1; j<13; j++) {
                    if(k === idx) return { r1:RANKS[i], r2:RANKS[j] };
                    k++;
                }
            }
        }

        function calcGTO(hand, pos, villain) {
            const vM = {'A':10,'K':8,'Q':7,'J':6,'T':5,'9':4.5,'8':4,'7':3.5,'6':3,'5':2.5,'4':2,'3':1.5,'2':1};
            let r1 = hand.h[0].r, r2 = hand.h[1].r;
            let s1 = vM[r1], s2 = vM[r2];
            if(s1 < s2) [s1, s2] = [s2, s1];
            let score = (hand.t === 'p') ? Math.max(5, s1 * 2) : s1;
            if(hand.t === 's') score += 2.2;
            const gap = RANKS.indexOf(r2) - RANKS.indexOf(r1) - 1;
            if(gap === 0) score += 1; else if(gap === 1) score -= 1; else if(gap >= 3) score -= 4;
            if(hand.t === 's' && r1 === 'A' && RANKS.indexOf(r2) >= 9) score += 1.5;

            const rfiLimits = { 'UTG':10, 'HJ':9.5, 'CO':8.8, 'BU':7.2, 'SB':7.2 };
            if(!villain) return score >= (rfiLimits[pos] || 7) ? 'Raise' : 'Fold';
            
            const villainRank = POSITIONS.indexOf(villain);
            const posPressure = (villainRank + 1) * 0.25;
            if(pos === 'BB') {
                if(score >= 11 - posPressure) return 'Raise';
                if(score >= 7.5 - posPressure) return 'Call';
                return 'Fold';
            }
            return score >= 11.5 - posPressure ? 'Raise' : 'Fold';
        }

        function initNewHand() {
            checkApiKey();
            state.lock = false;
            document.getElementById('feedback-overlay').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('btn-group').style.opacity = '1';
            state.currentHand = drawHand();
            state.heroPos = POSITIONS[Math.floor(Math.random() * 6)];
            const isFacing = (Math.random() > 0.4 && state.heroPos !== 'UTG');
            if(isFacing) {
                const possibleVils = POSITIONS.slice(0, POSITIONS.indexOf(state.heroPos));
                state.villainPos = possibleVils[Math.floor(Math.random() * possibleVils.length)] || 'BU';
            } else { state.villainPos = null; }
            state.correctAction = calcGTO(state.currentHand, state.heroPos, state.villainPos);
            updateBoard();
            state.startTime = Date.now();
        }

        function updateBoard() {
            POSITIONS.forEach(p => {
                const el = document.getElementById(`seat-${p}`);
                el.className = `seat pos-${p} ${p===state.heroPos?'hero':''} ${p===state.villainPos?'villain':''}`;
                el.innerHTML = p + (p === 'BU' ? '<div class="dealer-chip">D</div>' : '');
            });
            document.getElementById('hero-hand').innerHTML = state.currentHand.h.map(c => `
                <div class="card ${c.s.r?'suit-red':''}"><span>${c.r}</span><span style="align-self:flex-end;">${c.s.s}</span></div>
            `).join('');
            const hint = document.getElementById('fac-hint');
            hint.style.display = state.villainPos ? 'inline-block' : 'none';
            if(state.villainPos) hint.innerText = `面对 ${state.villainPos} Raise 2.5BB`;
            document.getElementById('pot-txt').innerText = `POT: ${state.villainPos ? '4.0' : '1.5'} BB`;
            const masterCount = Object.values(heatmap).filter(h => h.seen >= 5 && h.r/h.seen > 0.9).length;
            document.getElementById('st-hands').innerText = `总计: ${stats.total}`;
            document.getElementById('st-acc').innerText = `准度: ${(stats.right/(stats.total||1)*100).toFixed(1)}%`;
            document.getElementById('st-mastery').innerText = `169覆盖: ${Math.round(masterCount/169*100)}%`;
        }

        function makeDecision(action) {
            if(state.lock) return;
            state.lock = true;
            const isRight = (action === state.correctAction);
            const timeTaken = (Date.now() - state.startTime) / 1000;
            stats.total++; if(isRight) stats.right++;
            stats.logs.push({ h:state.currentHand.key, p:state.heroPos, v:state.villainPos, u:action, g:state.correctAction, t:timeTaken });
            const key = state.currentHand.key;
            if(!heatmap[key]) heatmap[key] = {seen:0, r:0};
            heatmap[key].seen++; if(isRight) heatmap[key].r++;
            localStorage.setItem('poker_v75_stats', JSON.stringify(stats));
            localStorage.setItem('poker_v75_heatmap', JSON.stringify(heatmap));
            showResult(isRight, action);
            if(stats.total === 100 || stats.total === 500 || stats.total === 1000 || (stats.total > 1000 && stats.total % 1000 === 0)) {
                triggerAiAudit(stats.total);
            }
        }

        function showResult(isRight, action) {
            const overlay = document.getElementById('feedback-overlay');
            overlay.style.display = 'flex';
            document.getElementById('fb-res').innerText = isRight ? "决策正确 ✅" : "决策偏离 ❌";
            document.getElementById('fb-res').style.color = isRight ? "var(--success)" : "var(--danger)";
            document.getElementById('fb-gto').innerText = `GTO 推荐动作: ${state.correctAction.toUpperCase()}`;
            document.getElementById('fb-coach').innerText = `耗时 ${((Date.now()-state.startTime)/1000).toFixed(2)}s。` + (isRight ? "肌肉记忆稳步形成。" : "请注意位置与牌力的非线性关系。");
            document.getElementById('next-btn').style.display = 'block';
        }

        async function triggerAiAudit(milestone) {
            if(!MY_GEMINI_KEY) return;
            const modal = document.getElementById('modal-ai');
            modal.style.display = 'flex';
            document.getElementById('ai-milestone').innerText = `${milestone} 手里程碑深度审计`;
            const errs = stats.logs.slice(-200).filter(l => l.u !== l.g);
            const leaks = Object.entries(heatmap).filter(([k,v]) => v.seen > 3 && v.r/v.seen < 0.7).map(([k,v]) => k);
            const prompt = `你是一位职业德扑战术审计员。玩家已完成 ${milestone} 手高强度训练。分析：1. 漏洞组合：${leaks.slice(0,10).join(', ')}。2. 位置偏差。3. 建议建议。语气客观专业直接。数据：${JSON.stringify({errors: errs, leaks: leaks})}`;
            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${MY_GEMINI_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await resp.json();
                document.getElementById('ai-content').innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { document.getElementById('ai-content').innerText = "AI 审计连接失败。"; }
        }

        function closeAiModal() { document.getElementById('modal-ai').style.display = 'none'; initNewHand(); }

        function toggleMatrix() {
            const modal = document.getElementById('modal-matrix');
            if(modal.style.display === 'flex') { modal.style.display = 'none'; return; }
            modal.style.display = 'flex';
            let html = '';
            RANKS.forEach((r1, i) => {
                RANKS.forEach((r2, j) => {
                    let key = (i === j) ? r1+r2 : (i < j ? r1+r2+'s' : r2+r1+'o');
                    let data = heatmap[key] || {seen:0, r:0};
                    let acc = data.seen > 0 ? data.r / data.seen : -1;
                    let color = 'var(--unseen)';
                    if(acc >= 0) {
                        if(acc >= 0.9 && data.seen >= 5) color = 'var(--high-acc)';
                        else if(acc < 0.7) color = 'var(--low-acc)';
                        else color = 'var(--mid-acc)';
                    }
                    html += `<div class="m-cell" style="background:${color}">${key}</div>`;
                });
            });
            document.getElementById('matrix-container').innerHTML = html;
        }

        window.onload = initNewHand;
    </script>
</body>
</html>
